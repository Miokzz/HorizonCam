name: Build HorizonCam APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'

      - name: Restore persistent debug signing key
        id: debug-key-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: horizoncam-debug-keystore-v1

      - name: Build debug APK
        run: gradle --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Save persistent debug signing key
        if: success() && steps.debug-key-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: horizoncam-debug-keystore-v1

      - name: Verify debug APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HorizonCam-S24-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HorizonCam-Validation
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Build reproducible source ZIP
        if: success()
        shell: bash
        run: |
          # Git contains the project; Gradle generates the official wrapper
          # scripts/JAR from the verified 9.6 distribution installed in CI.
          gradle wrapper --gradle-version '9.6.0'
          git archive --format=zip --output=HorizonCam-source.zip HEAD
          zip -q -u HorizonCam-source.zip gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar

      - name: Upload Android Studio source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HorizonCam-Android-Studio-source
          path: HorizonCam-source.zip
          if-no-files-found: error
          retention-days: 30
