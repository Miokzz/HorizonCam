name: Virtual-device camera smoke

on:
  push:
    branches: ['phase-1/**']
  workflow_dispatch:
    inputs:
      api-level:
        description: Android emulator API (one device per run)
        type: choice
        default: '35'
        options: ['35', '36']

permissions:
  contents: read

concurrency:
  group: camera-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  camera-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'
      - name: Install media inspection tools and compile SDK
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg python3-pil
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'emulator'
      - name: Validate smoke assertions and build APK
        run: |
          /usr/bin/python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
          gradle --stacktrace :app:assembleDebug
      - name: Check VM acceleration and select supported fallback
        id: acceleration
        shell: bash
        run: |
          uname -m
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || echo 'udev reload unavailable; checking existing device.'
          sudo udevadm trigger --name-match=kvm || echo 'udev trigger unavailable; checking existing device.'
          sudo udevadm settle --timeout=20 || true
          if [ -c /dev/kvm ]; then
            # This is the exact pre-existing device on this disposable hosted runner.
            sudo chmod 0666 /dev/kvm || echo 'KVM permission adjustment failed; software fallback remains available.'
            ls -l /dev/kvm
          else
            echo 'No /dev/kvm character device; no device node will be fabricated.'
          fi
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -r /dev/kvm ] && [ -w /dev/kvm ] && "$SDK_ROOT/emulator/emulator" -accel-check; then
            echo 'disable=false' >> "$GITHUB_OUTPUT"
            echo 'mode=verified KVM' >> "$GITHUB_OUTPUT"
            echo 'Camera smoke: emulator verified usable KVM.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'KVM is unavailable or unusable. Running supported software CPU emulation (-accel off).'
            echo 'disable=true' >> "$GITHUB_OUTPUT"
            echo 'mode=software CPU emulation' >> "$GITHUB_OUTPUT"
            echo 'Camera smoke: using software CPU fallback; boot/capture can take longer.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Capture on a real virtual camera
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api-level || '35' }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disable-linux-hw-accel: ${{ steps.acceleration.outputs.disable }}
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
            -camera-back emulated -camera-front none -skin 720x1280
          script: /usr/bin/python3 tools/ci/camera_smoke.py --apk app/build/outputs/apk/debug/app-debug.apk --output work/camera-smoke --ai
      - name: Upload emulator-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-smoke-api-${{ inputs.api-level || '35' }}
          path: work/camera-smoke/
          if-no-files-found: warn
          retention-days: 7
