name: Virtual-device camera smoke

on:
  push:
    branches: ['phase-1/**']
  workflow_dispatch:
    inputs:
      api-level:
        description: Android emulator API (one device per run)
        type: choice
        default: '35'
        options: ['35', '36']

permissions:
  contents: read

concurrency:
  group: camera-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  camera-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'
      - name: Install media inspection tools and compile SDK
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg python3-pil
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate smoke assertions and build APK
        run: |
          /usr/bin/python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
          gradle --stacktrace :app:assembleDebug
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Capture on a real virtual camera
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api-level || '35' }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disable-linux-hw-accel: false
          emulator-options: >-
            -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
            -camera-back emulated -camera-front none -skin 720x1280
          script: /usr/bin/python3 tools/ci/camera_smoke.py --apk app/build/outputs/apk/debug/app-debug.apk --output work/camera-smoke
      - name: Upload emulator-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-smoke-api-${{ inputs.api-level || '35' }}
          path: work/camera-smoke/
          if-no-files-found: warn
          retention-days: 7
